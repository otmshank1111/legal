<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorization callback</title>
<style>
 :root{--bg:#ffffff;--fg:#16181d;--muted:#5b616e;--rule:#e3e6ec;--accent:#e8384f;--card:#f7f8fa;--ok:#137a4b}
 @media (prefers-color-scheme:dark){:root{--bg:#111318;--fg:#e8eaf0;--muted:#9aa1b1;--rule:#272b34;--card:#181b22;--ok:#4ecb8d}}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 main{max-width:680px;margin:0 auto;padding:64px 24px 96px}
 h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
 .sub{color:var(--muted);margin:0 0 28px}
 .box{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;margin:18px 0}
 .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
 code{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;display:block}
 button{font:inherit;font-size:14px;padding:9px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer;margin-top:12px}
 button:hover{border-color:var(--accent)}
 .ok{color:var(--ok);font-weight:600}
 .err{color:var(--accent);font-weight:600}
 .note{color:var(--muted);font-size:14px;margin-top:28px;padding-top:18px;border-top:1px solid var(--rule)}
</style>
</head>
<body>
<main>
<h1>Authorization callback</h1>
<p class="sub" id="status">Reading response&hellip;</p>
<div id="out"></div>
<p class="note">This page runs entirely in your browser. Nothing on it is sent anywhere, logged, or stored. The authorization code below is short-lived and single-use.</p>
</main>
<script>
(function(){
  var p = new URLSearchParams(window.location.search);
  var code = p.get('code'), state = p.get('state');
  var err = p.get('error'), errDesc = p.get('error_description');
  var status = document.getElementById('status'), out = document.getElementById('out');

  function box(label, value, withCopy){
    var d = document.createElement('div'); d.className = 'box';
    var l = document.createElement('div'); l.className = 'label'; l.textContent = label;
    var c = document.createElement('code'); c.textContent = value;
    d.appendChild(l); d.appendChild(c);
    if (withCopy){
      var b = document.createElement('button');
      b.textContent = 'Copy';
      b.onclick = function(){
        navigator.clipboard.writeText(value).then(function(){
          b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy'; }, 1600);
        }, function(){ b.textContent = 'Select it manually'; });
      };
      d.appendChild(b);
    }
    out.appendChild(d);
  }

  if (err){
    status.innerHTML = '<span class="err">Authorization failed.</span>';
    box('error', err, false);
    if (errDesc) box('error_description', errDesc, false);
    return;
  }
  if (!code){
    status.textContent = 'No authorization code in the URL. Open this page by completing the TikTok authorization flow, not directly.';
    return;
  }
  status.innerHTML = '<span class="ok">Authorized.</span> Copy the code below and paste it into the script.';
  box('authorization code', code, true);
  if (state) box('state', state, false);
})();
</script>
</body>
</html>
